<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio</title>
  <style>
    body{margin:0;background:#0b0b0b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Arial}
    .topbar{
      position:sticky; top:0; z-index:10;
      display:flex; gap:10px; align-items:center; justify-content:space-between;
      padding:12px 12px;
      background:rgba(11,11,11,.92);
      backdrop-filter: blur(10px);
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .title{font-weight:600; opacity:.95}
    .actions{display:flex; gap:10px; flex-wrap:wrap}
    a.btn{
      background:#6d4cff; color:#fff; text-decoration:none;
      padding:10px 12px; border-radius:12px; display:inline-block;
      font-weight:600; font-size:14px;
    }
    a.btn.secondary{background:rgba(255,255,255,.10); font-weight:500}

    .viewer{
      height: calc(100vh - 56px);
      width:100%;
      border:0;
      display:block;
    }

    .loading{
      position:fixed; inset:56px 0 0 0;
      display:flex; align-items:center; justify-content:center;
      background:#0b0b0b;
      color:rgba(255,255,255,.75);
      font-size:14px;
      pointer-events:none;
    }
    .dot{animation: blink 1.2s infinite}
    .dot:nth-child(2){animation-delay:.2s}
    .dot:nth-child(3){animation-delay:.4s}
    @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}

    /* مربع التعليمات */
    .tip{
      position:fixed; left:12px; right:12px; bottom:12px; z-index:20;
      background:rgba(20,20,20,.92);
      border:1px solid rgba(255,255,255,.10);
      border-radius:14px;
      padding:10px 12px;
      font-size:12.5px;
      line-height:1.6;
      display:flex;
      gap:10px;
      align-items:flex-start;
      justify-content:space-between;
    }
    .tip b{color:#fff}
    .tip button{
      background:transparent;border:0;color:#fff;opacity:.8;
      font-size:16px;cursor:pointer;padding:2px 6px
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="title">Portfolio</div>

    <div class="actions">
      <!-- زر ملاءمة الصفحة (Fit Page) -->
      <a class="btn secondary" id="fitBtn" href="#">ملاءمة الصفحة</a>

      <!-- فتح في تبويب جديد (قد يفتح في Acrobat حسب إعداد جهاز المستخدم) -->
      <a class="btn" href="portfolio.pdf#page=1&view=Fit" target="_blank" rel="noopener">فتح</a>

      <!-- تحميل -->
      <a class="btn secondary" href="portfolio.pdf" download>تحميل</a>
    </div>
  </div>

  <div class="loading" id="loading">
    جارٍ تحميل الملف<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
  </div>

  <!-- عرض عادي داخل الصفحة -->
  <iframe
    id="pdf"
    class="viewer"
    src="portfolio.pdf#page=1&view=Fit"
    title="Portfolio PDF"
    onload="document.getElementById('loading').style.display='none';">
  </iframe>

  <!-- تعليمات مع زر إغلاق -->
  <div class="tip" id="tip">
    <div>
      إذا لم يظهر العرض على <b>ملاءمة الصفحة</b> أو تغيّر مستوى التكبير أثناء التنقّل، يرجى الضغط على زر <b>«ملاءمة الصفحة»</b> أعلى الصفحة.
      <br>
      <b>لتفعيل العناصر التفاعلية</b> (مثل أزرار التنقّل)، يرجى فتح الملف عبر <b>Adobe Acrobat</b>.
    </div>
    <button aria-label="إغلاق" onclick="document.getElementById('tip').style.display='none'">✕</button>
  </div>

  <script>
    // إعادة تحميل الملف مع Fit Page عند الضغط على "ملاءمة الصفحة"
    document.getElementById('fitBtn').addEventListener('click', (e) => {
      e.preventDefault();
      const f = document.getElementById('pdf');
      document.getElementById('loading').style.display = 'flex';
      f.src = "portfolio.pdf#page=1&view=Fit";
    });
  </script>

</body>
</html>
